<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000" />
    <title>Gallery</title>
    <style>
      * { 
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        background: #000;
        color: #fff;
      }

      #app {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .slides-container {
        display: flex;
        width: 100%;
        height: 100%;
        transition: transform 0.3s ease;
        will-change: transform;
      }

      .slide {
        flex: 0 0 100vw;
        width: 100vw;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
      }

      .slide img {
        width: 100%;
        height: auto;
        display: block;
        background: #000;
      }

      /* Navigation arrows */
      .nav-button {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 50px;
        height: 100px;
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.7);
        font-size: 36px;
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-button:active {
        color: rgba(255,255,255,1);
      }

      .nav-prev { left: 10px; }
      .nav-next { right: 10px; }

      /* Dots indicator */
      .dots {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 100;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.3);
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .dot.active {
        background: rgba(255,255,255,0.9);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="slides-container" id="slidesContainer">
        <div class="slide"><img src="images/togo_menu_page1a.jpg" alt="Menu Page 1A"></div>
        <div class="slide"><img src="images/togo_menu_page1b.jpg" alt="Menu Page 1B"></div>
        <div class="slide"><img src="images/togo_menu_page1c.jpg" alt="Menu Page 1C"></div>
        <div class="slide"><img src="images/togo_menu_page2a.jpg" alt="Menu Page 2A"></div>
        <div class="slide"><img src="images/togo_menu_page2b.jpg" alt="Menu Page 2B"></div>
        <div class="slide"><img src="images/togo_menu_page2c.jpg" alt="Menu Page 2C"></div>
      </div>

      <button class="nav-button nav-prev" onclick="navigate(-1)">‹</button>
      <button class="nav-button nav-next" onclick="navigate(1)">›</button>

      <div class="dots" id="dots"></div>
    </div>

    <script>
      let currentSlide = 0;
      const totalSlides = 6;
      const container = document.getElementById('slidesContainer');
      const dotsContainer = document.getElementById('dots');

      // Create dots
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement('button');
        dot.className = 'dot';
        dot.onclick = () => goToSlide(i);
        dotsContainer.appendChild(dot);
      }

      function updateView() {
        // Update slide position
        container.style.transform = `translateX(-${currentSlide * 100}vw)`;
        
        // Update dots
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
          dot.classList.toggle('active', index === currentSlide);
        });

        // Reset scroll position of current slide
        const slides = document.querySelectorAll('.slide');
        slides[currentSlide].scrollTop = 0;
      }

      function navigate(direction) {
        const newSlide = currentSlide + direction;
        if (newSlide >= 0 && newSlide < totalSlides) {
          currentSlide = newSlide;
          updateView();
        }
      }

      function goToSlide(index) {
        currentSlide = index;
        updateView();
      }

      // Swipe support
      let touchStartX = 0;
      let touchStartY = 0;
      let touchEndX = 0;
      let touchEndY = 0;

      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        
        // Only trigger horizontal swipe if horizontal movement is greater than vertical
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
          if (deltaX < 0) {
            navigate(1); // Swipe left
          } else {
            navigate(-1); // Swipe right
          }
        }
      }

      // Initialize
      updateView();
    </script>
  </body>
</html>
